[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meanrev"
version = "0.1.0"
description = "Hybrid C++/Python microstructure mean-reversion trading system"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12",
    "PyJWT[crypto]>=2.7",   # Coinbase CDP ES256 JWTs
    "solders>=0.21",        # Solana keypair/pubkey primitives
]

[project.optional-dependencies]
dev = ["pytest>=8", "pybind11>=2.12"]
# Optional hot-path accelerators: uvloop (libuv event loop) and orjson
# (fast websocket frame decode). The system runs without them.
perf = ["uvloop>=0.19", "orjson>=3.9"]

[tool.setuptools.packages.find]
include = ["meanrev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
